services:
  - type: web
    name: sapay-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: deploy/render-staging
    rootDir: sapay-core 15
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: APP_HOST
        value: 0.0.0.0
      - key: DATABASE_SSL
        value: "false"
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: PGHOST
        fromDatabase:
          name: sapay-staging-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: sapay-staging-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: sapay-staging-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: sapay-staging-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: sapay-staging-db
          property: password
databases:
  - name: sapay-staging-db
    plan: free
    region: frankfurt
    databaseName: sapay_staging_db
    user: sapay_staging_db_user
    postgresMajorVersion: 16
