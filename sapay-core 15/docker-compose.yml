services:
  postgres:
    image: postgres:16-alpine
    container_name: sapay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sapay_demo
      POSTGRES_USER: sapay_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sapay_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1' -q >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    container_name: sapay-api
    network_mode: host
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      PORT: "3000"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: sapay_demo
      PGUSER: sapay_app
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  sapay_pgdata:
