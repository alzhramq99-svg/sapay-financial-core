name: SApay CI

on:
  pull_request:
    branches: [main, deploy/render-staging]
    paths:
      - 'sapay-core 15/**'
      - '.github/workflows/sapay-ci.yml'
  push:
    branches: [main, deploy/render-staging, 'recovery/**', 'fix/**']
    paths:
      - 'sapay-core 15/**'
      - '.github/workflows/sapay-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sapay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'sapay-core 15'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'sapay-core 15/package-lock.json'

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --ci

      - name: Build production application
        run: npm run build

  postgres-integration:
    name: PostgreSQL integration and security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sapay_integration_test
          POSTGRES_USER: sapay_test
          POSTGRES_PASSWORD: sapay-ci-only-integration-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sapay_test -d sapay_integration_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: 'sapay-core 15'
    env:
      TEST_POSTGRES_PASSWORD: sapay-ci-only-integration-password
      DATABASE_URL: postgresql://sapay_test:sapay-ci-only-integration-password@127.0.0.1:5433/sapay_integration_test
      AUTH_TOKEN_SECRET: ci-only-auth-token-secret-at-least-32-characters
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'sapay-core 15/package-lock.json'

      - name: Install locked dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Initialize isolated integration database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/init/001_schema.sql

      - name: Run isolated PostgreSQL integration tests
        run: npm run test:integration
