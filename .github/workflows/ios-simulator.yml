name: SApay iOS Simulator build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sapay-core 15/mobile/**'
      - 'sapay-core 15/public/**'
      - '.github/workflows/ios-simulator.yml'

permissions:
  contents: read

jobs:
  build-simulator:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: 'sapay-core 15/mobile'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'sapay-core 15/mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: npm run copy:web

      - name: Generate Capacitor iOS project
        run: npx cap add ios --packagemanager CocoaPods

      - name: Build unsigned iOS Simulator app
        run: npm run build:ios:simulator

      - name: Verify generated iOS project
        run: node ./scripts/verify-ios-project.mjs

      - name: Verify simulator app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphonesimulator/App.app"
          test -d "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          echo "CFBundleIdentifier: $BUNDLE_ID"
          test "$BUNDLE_ID" = "com.saadaligroup.sapay"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIUserInterfaceStyle' "$APP_PATH/Info.plist")" = "Dark"
          test -s "$APP_PATH/public/index.html"
          test -s "$APP_PATH/public/biometric-bridge.js"
          # Xcode compiles AppIcon.appiconset (the official SApay monogram,
          # installed by configure-ios-icon.mjs) into the bundle.
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP_PATH/Info.plist")" = "AppIcon"
          test -s "$APP_PATH/Assets.car"
          ls "$APP_PATH" | grep -i '^AppIcon' || true

      - name: Archive sapay-ios-simulator (tar keeps executable permissions)
        # upload-artifact does not preserve file permissions, so an App.app
        # uploaded as a folder loses its executable bit.
        run: tar -C 'build/DerivedData/Build/Products/Release-iphonesimulator' -cf build/sapay-ios-simulator.tar App.app

      - name: Upload simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: sapay-ios-simulator
          path: 'sapay-core 15/mobile/build/sapay-ios-simulator.tar'
          if-no-files-found: error
          retention-days: 14
